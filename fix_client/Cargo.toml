[package]
name = "fix_client"
version = "0.1.0"
edition = "2021"
description = "Client FIX 4.4 pour le moteur opengraph — chemins ouverts FX, Convention A, compte NETTED."
license = "LicenseRef-Proprietary"
publish = false

[[bin]]
name = "fix_client"
path = "src/main.rs"

[lib]
name = "fix_client"
path = "src/lib.rs"

[features]
test_utils = []

[dependencies]
opengraph = { path = "../engine" }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
toml = "0.8"
anyhow = "1"
thiserror = "1"
