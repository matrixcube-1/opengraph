[package]
name = "ctrader_client"
version = "0.1.0"
edition = "2021"
description = "Client cTrader Open API v2 (IC Markets) pour le moteur opengraph — chemins ouverts, Convention A."
license = "LicenseRef-Proprietary"
publish = false

[[bin]]
name = "ctrader_client"
path = "src/main.rs"

[lib]
name = "ctrader_client"
path = "src/lib.rs"

[features]
# Expose `io::mock` hors tests (bancs d'essai réseau).
test_utils = []

[dependencies]
opengraph = { path = "../engine" }
quacky = "0.2.20251024"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
